<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  .icon{width:1024px;height:1024px;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(135deg,#1f6feb 0%,#7a3ff2 60%,#b23ff2 100%);position:relative;overflow:hidden}
  .icon::after{content:"";position:absolute;inset:0;
        background:radial-gradient(1200px 600px at 80% 10%,rgba(255,255,255,.18),transparent 60%)}
  svg{width:640px;height:640px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.28))}
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Flicklax">
      <!-- house roof -->
      <path d="M18 50 L50 24 L82 50" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- house body -->
      <path d="M28 50 V78 H72 V50" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- door -->
      <rect x="44" y="60" width="12" height="18" rx="2" fill="#ffffff"/>
      <!-- spark / signal -->
      <circle cx="74" cy="30" r="6" fill="#ffffff"/>
    </svg>
  </div>
</body>
</html>
